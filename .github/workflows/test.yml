name: Test

# push is scoped to main rather than "**" so a PR commit is tested ONCE. With
# both triggers open to every branch, each push to a branch with an open PR ran
# the suite twice — once for the push, once for the pull_request — on the same
# code, doubling the CI minutes for no extra signal. The pull_request run is the
# better of the two anyway: it tests the merge commit (branch + base), not the
# branch in isolation.
#
# Trade-off: a branch with no PR open now gets no CI. Open the PR early (draft is
# fine) if you want the suite running while you iterate.
#
# workflow_call is how deploy.yml / deploy-steam.yml gate a release on the suite.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  gut:
    name: GUT Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-4.6.2-linux-headless

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d godot
          chmod +x godot/Godot_v4.6.2-stable_linux.x86_64

      # The GDExtension has to exist BEFORE Godot starts, or every Native* class
      # is absent and each parity suite skips itself — which is green, and which
      # is exactly how NativePuckStep drifted two commits from its GDScript
      # reference and reached main (#678/#679). The suites are the only thing
      # holding a C++ port to its reference, so CI has to build the thing it is
      # testing. A Linux template_debug build is enough here; the shipped Windows
      # template_release DLL is deploy.yml's job.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Resolve godot-cpp revision
        id: gdcpp
        run: echo "sha=$(git rev-parse HEAD:native/godot-cpp)" >> "$GITHUB_OUTPUT"

      # godot-cpp dominates a cold build (minutes); the six kernels are seconds.
      # SCONS_CACHE is content-addressed, so the submodule SHA pins the expensive
      # half while the restore-key still reuses it when only native/src moved.
      - name: Cache SCons build
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-${{ steps.gdcpp.outputs.sha }}-${{ hashFiles('native/src/**', 'native/SConstruct', 'native/build_profile.json') }}
          restore-keys: |
            scons-${{ runner.os }}-${{ steps.gdcpp.outputs.sha }}-

      - name: Build GDExtension
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          git submodule update --init --depth 1 native/godot-cpp
          bash native/build.sh
          ls -l native/bin/

      - name: Import project
        run: |
          # First launch generates .godot/imported/ for any scene/resource
          # that tests might touch. Ignore non-zero exit; --quit sometimes
          # returns 1 even on successful import.
          ./godot/Godot_v4.6.2-stable_linux.x86_64 --headless --import --quit 2>&1 || true

      # MITTS_REQUIRE_NATIVE turns "kernel absent" from a skip into a failure
      # (tests/native_parity_guard.gd). The build step above means absent can only
      # mean the build or the class registration broke — the one case where the
      # old skip painted a broken gate green.
      - name: Run GUT tests
        env:
          MITTS_REQUIRE_NATIVE: '1'
        run: |
          ./godot/Godot_v4.6.2-stable_linux.x86_64 --headless -s addons/gut/gut_cmdln.gd -gexit
