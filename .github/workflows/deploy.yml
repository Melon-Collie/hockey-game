name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: GUT Unit Tests
    uses: ./.github/workflows/test.yml

  export:
    name: Export and Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0  # full history so `git rev-list --count HEAD` is meaningful
          submodules: true  # native/godot-cpp, needed to build the GDExtension

      - name: Compute version
        id: version
        run: |
          COMMITS=$(git rev-list --count HEAD)
          VERSION="0.1.${COMMITS}"
          echo "Computed VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Bake the version into the build for the in-game version display
          # and bug-report telemetry.
          sed -i "s/^const VERSION: String = \"dev\"$/const VERSION: String = \"${VERSION}\"/" Scripts/game/build_info.gd
          grep '^const VERSION:' Scripts/game/build_info.gd
          # Stamp Windows exe version metadata (x.x.x.x format required by
          # rcedit). Committed preset keeps these empty so local exports
          # without rcedit never trip format validation.
          sed -i "s|^application/file_version=.*|application/file_version=\"${VERSION}.0\"|" export_presets.cfg
          sed -i "s|^application/product_version=.*|application/product_version=\"${VERSION}.0\"|" export_presets.cfg

      # The Windows exe icon + version strings are embedded by rcedit (run
      # through wine). icon.ico is committed (generated from icon.svg), so the
      # only build-time dependency here is rcedit/wine. Best-effort: if the
      # setup fails, Godot skips embedding (warning, not error) and the export
      # proceeds with the default icon.
      - name: Set up rcedit for Windows exe branding
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64
          WINE_BIN=$(command -v wine64 || command -v wine)
          curl -fsSL -o /usr/local/bin/rcedit.exe \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "/usr/local/bin/rcedit.exe"
          export/windows/wine = "${WINE_BIN}"
          EOF
          echo "rcedit configured (wine: ${WINE_BIN})"

      # Build the native GDExtension for every shipped platform BEFORE export.
      # The binaries are gitignored (dev machines build their own), and Godot's
      # export fails outright when a library mapped in
      # native/mitts_native.gdextension is missing — so each exported preset
      # needs its build here: the Windows DLL cross-compiled with mingw-w64
      # (godot-cpp statically links the runtime, so no extra dependencies)
      # and the Linux .so with the runner's host g++.
      - name: Build native GDExtension (Windows + Linux release)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64 scons
          cd native
          scons platform=windows arch=x86_64 target=template_release use_mingw=yes \
                build_profile=build_profile.json -j"$(nproc)"
          scons platform=linux arch=x86_64 target=template_release \
                build_profile=build_profile.json -j"$(nproc)"
          ls -la bin/

      - name: Export with Godot
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz"
          relative_project_path: "./"
          archive_output: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ship the third-party license notices next to the binary. The repo-root
      # LICENSES.txt isn't a Godot resource, so it never lands in the .pck —
      # it has to be added to each archive here.
      - name: Bundle license notices into archives
        run: |
          shopt -s nullglob
          for zip in /home/runner/.local/share/godot/archives/*.zip; do
            zip -j "$zip" LICENSES.txt
          done

      - name: Verify export artifacts
        run: |
          echo "=== Archive directory contents ==="
          ls -la /home/runner/.local/share/godot/archives/ || echo "Archive directory missing!"

          shopt -s nullglob
          zips=(/home/runner/.local/share/godot/archives/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: No zip archives produced"
            exit 1
          fi

          for zip in "${zips[@]}"; do
            size=$(stat -c%s "$zip")
            echo "$zip: ${size} bytes"
            if [ "$size" -lt 1048576 ]; then
              echo "ERROR: Archive is suspiciously small (< 1MB)"
              exit 1
            fi
            unzip -l "$zip" | grep -qE "\.(exe|x86_64)" || { echo "ERROR: No .exe or .x86_64 found in $zip"; exit 1; }
            unzip -l "$zip" | grep -q "LICENSES.txt" || { echo "ERROR: LICENSES.txt missing from $zip"; exit 1; }
          done
          echo "All archives look good."

      - name: Push tags (latest + versioned)
        run: |
          git tag -f latest
          git push origin -f latest
          # Immutable per-release tag so a bad build can be rolled back by
          # pointing players at the previous version's release.
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin -f "v${{ steps.version.outputs.version }}"

      # Distribution runs in parallel: Steam (deploy-steam.yml) is the primary
      # channel, and public GitHub Releases stay available for direct download
      # while the closed beta winds down. Both publish from the same export.
      #
      # Versioned archive release (prerelease so the GitHub "Latest" badge
      # keeps pointing at the rolling "latest" release below). This is the
      # rollback path: every build stays downloadable.
      - name: Upload versioned release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "/home/runner/.local/share/godot/archives/*.zip"
          tag: "v${{ steps.version.outputs.version }}"
          name: "${{ steps.version.outputs.version }}"
          body: "Archived build ${{ steps.version.outputs.version }}. Most players want the [latest release](../../releases/tag/latest)."
          prerelease: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Recreate the rolling "latest" release from scratch each build. Updating
      # it in place (allowUpdates) leaves `published_at` frozen at the original
      # 2026-04-07 publish, so the release date shown on GitHub never moves even
      # though the assets do. Deleting first gives every build a fresh date. The
      # `latest` tag is re-pushed above, so download links keep working.
      - name: Delete previous "latest" release
        continue-on-error: true  # first run / nothing to delete
        run: gh release delete latest --yes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "/home/runner/.local/share/godot/archives/*.zip"
          tag: "latest"
          name: "${{ steps.version.outputs.version }}"
          body: |
            3v3 hockey — alpha build for playtesters. Windows and Linux (no macOS build yet).

            **Online play needs Steam running** on every machine. Host a game or join from the in-game lobby browser (Esc → Online); Steam friend invites work too. No port forwarding required.

            **Known alpha limitations:** if the host leaves, the match ends for everyone; there's no reconnect — if you drop, rejoin from the lobby browser (fresh slot and stats); no in-game chat; a team plays shorthanded if someone disconnects mid-match.

            **Found a bug?** Use the in-game Report Bug button (bottom-right corner). If the game crashed, attach the newest log from `%APPDATA%\Godot\app_userdata\Mitts\logs` (Windows) or `~/.local/share/godot/app_userdata/Mitts/logs` (Linux).

            Older builds are kept under [pre-releases](../../releases) if you need to roll back.
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}